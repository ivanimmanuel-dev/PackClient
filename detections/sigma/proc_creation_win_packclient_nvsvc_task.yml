title: PackClient NvSvc Logon Task Creation
id: 148e6a44-1d6c-4d3b-9518-6c64d88e3792
status: experimental
description: Detects the task name and installed path observed in the documented PackClient chain.
references:
  - https://www.proofpoint.com/us/blog/threat-insight/carry-compromise-ta4922-packs-packclient
author: Ivan Immanuel Shaji
date: 2026-09-05
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\schtasks.exe'
  selection_task:
    CommandLine|contains|all:
      - '/Create'
      - '/TN'
      - 'NvSvc'
      - '/SC'
      - 'ONLOGON'
      - 'Tax_Notice_23665.exe'
  selection_path:
    CommandLine|contains: '\ProgramData\NVIDIA Corporation\NvSvc\'
  condition: all of selection_*
falsepositives:
  - A locally deployed task that intentionally reuses the exact name and path; verify target hash and signer.
level: high
